```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
<defs>
  <radialGradient id="bg" cx="50%" cy="48%" r="70%">
    <stop offset="0" stop-color="#181818"/>
    <stop offset=".55" stop-color="#080808"/>
    <stop offset="1" stop-color="#010101"/>
  </radialGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M50 0H0V50"
          fill="none"
          stroke="#fff"
          stroke-opacity=".045"/>
  </pattern>

  <clipPath id="screen">
    <rect x="0" y="0" width="1400" height="900" rx="12"/>
  </clipPath>
</defs>

<!-- VOID -->
<rect width="1400" height="900" rx="12" fill="url(#bg)"/>
<rect width="1400" height="900" rx="12" fill="url(#grid)"/>

<g clip-path="url(#screen)">

  <!-- SCAN FIELD -->
  <g opacity=".12">
    <path d="
      M0 80H1400
      M0 140H1400
      M0 200H1400
      M0 260H1400
      M0 320H1400
      M0 380H1400
      M0 440H1400
