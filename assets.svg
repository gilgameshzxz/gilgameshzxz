  <!-- WAVEFORM -->
  <path d="
    M70 760
    C120 760 120 720 170 760
    S220 800 270 760
    S320 710 370 760
    S420 810 470 760
    S520 720 570 760
    S620 805 670 760
    S720 715 770 760
    S820 805 870 760
    S920 720 970 760
    S1020 810 1070 760
    S1120 715 1170 760
    S1220 800 1270 760
    S1320 720 1330 760"
    fill="none"
