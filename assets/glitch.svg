  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .msg { font-size: 17px; font-weight: 700; letter-spacing: 3px; }
    .ww { fill: #f0f6fc; animation: jw 2.2s infinite steps(1); }
