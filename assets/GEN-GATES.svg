"""Generate assets/gates.svg (descent through seven gates) and assets/sigil.svg."""
import math
import sys
from html import escape

ASSETS = sys.argv[1]
FONT = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace'
ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"]

# ---------------------------------------------------------------- gates.svg
W, H, VX, VY = 1000, 440, 500, 205
STEP, T = 3.0, 24.0  # 3s per gate, 3s reveal
S = [0.80 ** k for k in range(8)]
pct = lambda s: f"{s / T * 100:.3f}%"

TOLLS = [
    ("the guard takes your timeline", "you are now unordered. it feels fine."),
    ("the guard takes your name", "you answer to ??? now. so does the guard."),
    ("the guard takes your definitions", "words still work. nobody knows why."),
    ("the guard takes your README", "it was never real. it was a long loading screen."),
    ("the guard takes your observer", "nobody is watching. something is."),
    ("the guard takes your last question", "it gives back a smaller question, still warm."),
    ("the guard takes nothing", "there is nothing left. it takes that too."),
]

ARCH = "M-260,160 L-260,-55 A260,115 0 0,1 260,-55 L260,160"

gates, css = [], []
for k in reversed(range(7)):  # back to front so front gates draw on top
    s = S[k]
    a, b = k * STEP, (k + 1) * STEP
    css.append(
        f"@keyframes g{k}{{0%,{pct(a)}{{opacity:0}}{pct(a + .3)},{pct(b - .2)}{{opacity:1}}{pct(b + .6)},100%{{opacity:.18}}}}"
        f".g{k}{{opacity:0;animation:g{k} {T}s infinite}}"
    )
    gates.append(
        f'<g transform="translate({VX} {VY}) scale({s:.4f})">'
        f'<path d="{ARCH} Z" fill="#000" fill-opacity=".16"/>'
        f'<path d="{ARCH}" class="base"/>'
        f'<g class="g{k}"><path d="{ARCH}" class="glow" filter="url(#blur)"/><path d="{ARCH}" class="lit"/></g>'
        f'<text y="-150" text-anchor="middle" class="num" style="font-size:{13 / s:.1f}px">{ROMAN[k]}</text>'
        f'</g>'
    )

# traveller walks inward, one gate per STEP
kf = ";".join(f"{1.12 * S[k]:.4f}" for k in range(8))
kt = ";".join(f"{(k * STEP) / T:.4f}" for k in range(8))
traveller = (
    f'<g transform="translate({VX} {VY})"><g>'
    f'<animateTransform attributeName="transform" type="scale" values="{kf};{1.12 * S[7]:.4f};1.12" '
    f'keyTimes="{kt};0.97;1" dur="{T}s" repeatCount="indefinite"/>'
    f'<circle cy="150" r="9" fill="#f0f6fc" filter="url(#blur)"/><circle cy="150" r="5" fill="#fff"/>'
    f'<text x="14" y="154" class="you">you</text></g></g>'
)

captions, counters = [], []
for k, (toll, after) in enumerate(TOLLS):
    a, b = k * STEP, (k + 1) * STEP
    css.append(
        f"@keyframes c{k}{{0%,{pct(a)}{{opacity:0}}{pct(a + .3)},{pct(b - .3)}{{opacity:1}}{pct(b)},100%{{opacity:0}}}}"
        f".c{k}{{opacity:0;animation:c{k} {T}s infinite}}"
    )
    captions.append(
        f'<g class="c{k}"><text x="{VX}" y="398" text-anchor="middle" class="cap">'
        f'<tspan fill="#e3b341">GATE {ROMAN[k]}</tspan> · {escape(toll)}</text>'
        f'<text x="{VX}" y="420" text-anchor="middle" class="cap2">{escape(after)}</text></g>'
    )
    counters.append(f'<text x="976" y="52" text-anchor="end" class="hud c{k}">SURRENDERED <tspan class="hudv">{k}/7</tspan></text>')
a = 7 * STEP
css.append(
    f"@keyframes c7{{0%,{pct(a)}{{opacity:0}}{pct(a + .3)},98%{{opacity:1}}100%{{opacity:0}}}}"
    f".c7{{opacity:0;animation:c7 {T}s infinite}}"
    f"@keyframes core{{0%,{pct(a - 1)}{{opacity:.15}}{pct(a + .4)},97%{{opacity:1}}100%{{opacity:.15}}}}"
    f".core{{animation:core {T}s infinite}}"
)
captions.append(
    f'<g class="c7"><text x="{VX}" y="398" text-anchor="middle" class="cap"><tspan fill="#a371f7">BEYOND THE SEVENTH GATE</tspan> · ???</text>'
    f'<text x="{VX}" y="420" text-anchor="middle" class="cap2">nothing was there. it had been waiting for you. it asked if you brought the README.</text></g>'
)
counters.append(f'<text x="976" y="52" text-anchor="end" class="hud c7">SURRENDERED <tspan class="hudv" fill="#ff7b72">everything</tspan></text>')

floor = "".join(
    f'<line x1="{VX - 260 * S[k]:.1f}" y1="{VY + 160 * S[k]:.1f}" x2="{VX + 260 * S[k]:.1f}" y2="{VY + 160 * S[k]:.1f}" class="fl"/>'
    for k in range(7)
)

gates_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
  <defs>
    <clipPath id="card"><rect width="{W}" height="{H}" rx="14"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <radialGradient id="abyss" cx="{VX / W:.2f}" cy="{VY / H:.2f}" r="35%">
      <stop offset="0" stop-color="#a371f7" stop-opacity=".35"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text {{ font-family: {FONT}; }}
    .base {{ fill: none; stroke: #30363d; stroke-width: 1.5; vector-effect: non-scaling-stroke; }}
    .lit {{ fill: none; stroke: #e3b341; stroke-width: 2; vector-effect: non-scaling-stroke; }}
    .glow {{ fill: none; stroke: #e3b341; stroke-width: 10; vector-effect: non-scaling-stroke; }}
    .num {{ fill: #6e7681; font-weight: 700; }}
    .fl {{ stroke: #21262d; stroke-width: 1; }}
    .you {{ font-size: 13px; fill: #f0f6fc; }}
    .cap {{ font-size: 17px; fill: #f0f6fc; }}
    .cap2 {{ font-size: 13px; fill: #8b949e; }}
    .hud {{ font-size: 12px; fill: #6e7681; }}
    .hudv {{ fill: #c9d1d9; }}
    .core {{ font-size: 26px; font-weight: 800; fill: #d2a8ff; }}
    .blink {{ animation: bl 1s infinite steps(1); }}
    @keyframes bl {{ 50% {{ opacity: 0 }} }}
    {"".join(css)}
  </style>
  <g clip-path="url(#card)">
    <rect width="{W}" height="{H}" fill="#0d1117"/>
    <rect width="{W}" height="{H}" fill="url(#abyss)"/>
    <line x1="{VX}" y1="{VY}" x2="{VX - 260}" y2="{VY + 160}" class="fl"/>
    <line x1="{VX}" y1="{VY}" x2="{VX + 260}" y2="{VY + 160}" class="fl"/>
    <line x1="{VX}" y1="{VY}" x2="0" y2="{H}" class="fl"/>
    <line x1="{VX}" y1="{VY}" x2="{W}" y2="{H}" class="fl"/>
    {floor}
    <text x="{VX}" y="{VY}" text-anchor="middle" dominant-baseline="central" class="core">???</text>
    {"".join(gates)}
    {traveller}
    <text x="24" y="32" class="hud">THE DESCENT · <tspan class="hudv">what exists behind the seven gates</tspan></text>
    <text x="24" y="52" class="hud">EXIT <tspan class="hudv">none found</tspan> · RETURN TICKET <tspan class="hudv" fill="#ff7b72">expired</tspan></text>
    <text x="976" y="32" text-anchor="end" class="hud">DEPTH <tspan class="hudv">below the README <tspan class="blink">█</tspan></tspan></text>
    {"".join(counters)}
    {"".join(captions)}
  </g>
  <rect x=".5" y=".5" width="{W - 1}" height="{H - 1}" rx="14" fill="none" stroke="#30363d"/>
</svg>
'''

# ---------------------------------------------------------------- sigil.svg
SW, SH, CX, CY = 1000, 412, 500, 196
R = 112
pts = [(R * math.cos(math.radians(-90 + k * 360 / 7)), R * math.sin(math.radians(-90 + k * 360 / 7))) for k in range(7)]
poly = lambda order: " ".join(f"{pts[i][0]:.2f},{pts[i][1]:.2f}" for i in order)
star73 = poly([0, 3, 6, 2, 5, 1, 4])
star72 = poly([0, 2, 4, 6, 1, 3, 5])
circle = lambda r: f"M{-r},0 a{r},{r} 0 1,1 {2 * r},0 a{r},{r} 0 1,1 {-2 * r},0"

RING1 = "WHAT ENTERS AS A QUESTION LEAVES AS A SMALLER QUESTION · THE SEVENTH GATE OPENS INWARD · INWARD OF WHAT · "
RING2 = "DO NOT COUNT THE GATES · IF YOU COUNT EIGHT, STOP · THE GUARD IS NOT A GUARD · THE DOOR IS NOT A DOOR · THE TOLL IS EVERYTHING YOU DEFINED · "

vertex = "".join(
    f'<g transform="translate({x:.2f} {y:.2f})"><circle r="7" class="v" style="animation-delay:{k * .5}s"/>'
    f'<text y="-14" text-anchor="middle" class="vn">{ROMAN[k]}</text></g>'
    for k, (x, y) in enumerate(pts)
)

LEFT = [("SIGIL", "of the seventh gate"), ("STATUS", "ajar"), ("OPENS", "inward"), ("KEY", "???"), ("GUARD", "on break since 2100 BC")]
RIGHT = [("LAST OPENED", "never"), ("NEXT OPENING", "yesterday"), ("CONTENTS", "[REDACTED]"), ("SMELLS LIKE", "old questions"), ("WARNING", "there may be eight")]
side = lambda rows, x, anchor: "".join(
    f'<text x="{x}" y="{110 + i * 40}" text-anchor="{anchor}" class="hud">{a}</text>'
    f'<text x="{x}" y="{127 + i * 40}" text-anchor="{anchor}" class="hudv2">{escape(b)}</text>'
    for i, (a, b) in enumerate(rows)
)

sigil_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{SW}" height="{SH}" viewBox="0 0 {SW} {SH}">
  <defs>
    <clipPath id="card"><rect width="{SW}" height="{SH}" rx="14"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="r1" d="{circle(150)}"/>
    <path id="r2" d="{circle(172)}"/>
    <radialGradient id="aura" cx="50%" cy="50%" r="30%">
      <stop offset="0" stop-color="#e3b341" stop-opacity=".18"/><stop offset="1" stop-color="#e3b341" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text {{ font-family: {FONT}; }}
    .cw {{ animation: rot 80s linear infinite; }}
    .ccw {{ animation: rot 120s linear infinite reverse; }}
    .star {{ animation: rot 40s linear infinite reverse; }}
    @keyframes rot {{ to {{ transform: rotate(360deg) }} }}
    .ring {{ font-size: 11px; letter-spacing: 2px; fill: #8b949e; }}
    .ring2 {{ font-size: 10px; letter-spacing: 2px; fill: #6e7681; }}
    .v {{ fill: #0d1117; stroke: #e3b341; stroke-width: 1.5; animation: vp 3.5s infinite; }}
    @keyframes vp {{ 0%, 30%, 100% {{ fill: #0d1117 }} 10% {{ fill: #e3b341 }} }}
    .vn {{ font-size: 10px; fill: #6e7681; }}
    .hud {{ font-size: 11px; letter-spacing: 1px; fill: #6e7681; }}
    .hudv2 {{ font-size: 14px; fill: #c9d1d9; }}
    .whisper {{ font-size: 12px; fill: #6e7681; opacity: 0; animation: wh 12s infinite; }}
    @keyframes wh {{ 0% {{ opacity: 0 }} 5%, 28% {{ opacity: 1 }} 33%, 100% {{ opacity: 0 }} }}
  </style>
  <g clip-path="url(#card)">
    <rect width="{SW}" height="{SH}" fill="#0d1117"/>
    <rect width="{SW}" height="{SH}" fill="url(#aura)"/>
    <g transform="translate({CX} {CY})">
      <g class="ccw"><circle r="172" fill="none" stroke="#21262d" stroke-dasharray="1 5"/>
        <text class="ring2"><textPath href="#r2" textLength="{2 * math.pi * 172 * .985:.1f}">{escape(RING2)}</textPath></text></g>
      <g class="cw"><circle r="138" fill="none" stroke="#30363d"/>
        <text class="ring"><textPath href="#r1" textLength="{2 * math.pi * 150 * .985:.1f}">{escape(RING1)}</textPath></text></g>
      <g class="star">
        <polygon points="{star72}" fill="none" stroke="#30363d" stroke-width="1"/>
        <polygon points="{star73}" fill="none" stroke="#e3b341" stroke-width="1.6" filter="url(#blur)" opacity=".6"/>
        <polygon points="{star73}" fill="none" stroke="#e3b341" stroke-width="1.2"/>
        {vertex}
      </g>
    </g>
    </g>
    {side(LEFT, 40, "start")}
    {side(RIGHT, 960, "end")}
    <text x="{CX}" y="{SH - 14}" text-anchor="middle" class="whisper" style="animation-delay:0s">the sigil is not looking at you. it is looking at what you are about to define.</text>
    <text x="{CX}" y="{SH - 14}" text-anchor="middle" class="whisper" style="animation-delay:4s">it has been counting the gates. it keeps getting a different number.</text>
    <text x="{CX}" y="{SH - 14}" text-anchor="middle" class="whisper" style="animation-delay:8s">Gilgamesh asked it about immortality. it rotated. that was the answer.</text>
  </g>
  <rect x=".5" y=".5" width="{SW - 1}" height="{SH - 1}" rx="14" fill="none" stroke="#30363d"/>
</svg>
'''

for name, svg in (("gates.svg", gates_svg), ("sigil.svg", sigil_svg)):
    with open(f"{ASSETS}/{name}", "w", encoding="utf-8") as f:
        f.write(svg)
    print("wrote", name)
