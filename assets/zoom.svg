<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <clipPath id="card"><rect width="1000" height="320" rx="14"/></clipPath>
    <radialGradient id="hole" cx="50%" cy="45%" r="40%">
      <stop offset="0" stop-color="#000" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .z { opacity: 0; animation: zoom 14s cubic-bezier(.75,0,1,1) infinite; }
    @keyframes zoom {
      0%   { transform: scale(.04); opacity: 0 }
      18%  { opacity: 1 }
      50%  { opacity: .55 }
      68%  { opacity: 0 }
      100% { transform: scale(7); opacity: 0 }
    }
    .w { font-size: 30px; font-weight: 700; }
    .ring { fill: none; stroke-width: 1.2; }
    .hud { font-size: 12px; fill: #6e7681; }
    .hudv { fill: #c9d1d9; }
    .blink { animation: bl 1s infinite steps(1); }
    @keyframes bl { 50% { opacity: 0 } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="#0d1117"/>
    <rect width="1000" height="320" fill="url(#hole)"/>

    <g transform="translate(500 145)">
      <g class="z" style="animation-delay:0s"><circle r="70" class="ring" stroke="#30363d"/><text class="w" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">everything</text></g>
      <g class="z" style="animation-delay:-2s"><circle r="70" class="ring" stroke="#58a6ff"/><text class="w" fill="#58a6ff" text-anchor="middle" dominant-baseline="central">a system</text></g>
      <g class="z" style="animation-delay:-4s"><circle r="70" class="ring" stroke="#3fb950"/><text class="w" fill="#3fb950" text-anchor="middle" dominant-baseline="central">a structure</text></g>
      <g class="z" style="animation-delay:-6s"><circle r="70" class="ring" stroke="#e3b341"/><text class="w" fill="#e3b341" text-anchor="middle" dominant-baseline="central">a relation</text></g>
      <g class="z" style="animation-delay:-8s"><circle r="70" class="ring" stroke="#ff7b72"/><text class="w" fill="#ff7b72" text-anchor="middle" dominant-baseline="central">a distinction</text></g>
      <g class="z" style="animation-delay:-10s"><circle r="70" class="ring" stroke="#a371f7"/><text class="w" fill="#a371f7" text-anchor="middle" dominant-baseline="central">???</text></g>
      <g class="z" style="animation-delay:-12s"><circle r="70" class="ring" stroke="#22d3ee"/><text class="w" fill="#22d3ee" text-anchor="middle" dominant-baseline="central">Gilgamesh?</text></g>
    </g>

    <!-- HUD -->
    <text x="24" y="32" class="hud">ZOOM <tspan class="hudv">×∞</tspan></text>
    <text x="24" y="50" class="hud">DEPTH <tspan class="hudv">still going</tspan></text>
    <text x="976" y="32" text-anchor="end" class="hud">TARGET <tspan class="hudv">the primitive</tspan></text>
    <text x="976" y="50" text-anchor="end" class="hud">FOUND <tspan class="hudv" fill="#ff7b72">nothing yet <tspan class="blink">█</tspan></tspan></text>

    <text x="500" y="282" text-anchor="middle" style="font-size:15px;fill:#c9d1d9">semantic zoom: removing decorations until something refuses to be removed</text>
    <text x="500" y="303" text-anchor="middle" class="hud">the problem now has infinite zoom · please keep your hands inside the ontology</text>
  </g>
  <rect x=".5" y=".5" width="999" height="319" rx="14" fill="none" stroke="#30363d"/>
</svg>
