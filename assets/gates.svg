    <text x="976" y="32" text-anchor="end" class="hud">DEPTH <tspan class="hudv">below the README <tspan class="blink">█</tspan></tspan></text>
    <text x="976" y="52" text-anchor="end" class="hud c0">SURRENDERED <tspan class="hudv">0/7</tspan></text><text x="976" y="52" text-anchor="end" class="hud c1">SURRENDERED <tspan class="hudv">1/7</tspan></text><text x="976" y="52" text-anchor="end" class="hud c2">SURRENDERED <tspan class="hudv">2/7</tspan></text><text x="976" y="52" text-anchor="end" class="hud c3">SURRENDERED <tspan class="hudv">3/7</tspan></text><text x="976" y="52" text-anchor="end" class="hud c4">SURRENDERED <tspan class="hudv">4/7</tspan></text><text x="976" y="52" text-anchor="end" class="hud c5">SURRENDERED <tspan class="hudv">5/7</tspan></text><text x="976" y="52" text-anchor="end" class="hud c6">SURRENDERED <tspan class="hudv">6/7</tspan></text><text x="976" y="52" text-anchor="end" class="hud c7">SURRENDERED <tspan class="hudv" fill="#ff7b72">everything</tspan></text>
    <g class="c0"><text x="500" y="398" text-anchor="middle" class="cap"><tspan fill="#e3b341">GATE I</tspan> · the guard takes your timeline</text><text x="500" y="420" text-anchor="middle" class="cap2">you are now unordered. it feels fine.</text></g><g class="c1"><text x="500" y="398" text-anchor="middle" class="cap"><tspan fill="#e3b341">GATE II</tspan> · the guard takes your name</text><text x="500" y="420" text-anchor="middle" class="cap2">you answer to ??? now. so does the guard.</text></g><g class="c2"><text x="500" y="398" text-anchor="middle" class="cap"><tspan fill="#e3b341">GATE III</tspan> · the guard takes your definitions</text><text x="500" y="420" text-anchor="middle" class="cap2">words still work. nobody knows why.</text></g><g class="c3"><text x="500" y="398" text-anchor="middle" class="cap"><tspan fill="#e3b341">GATE IV</tspan> · the guard takes your README</text><text x="500" y="420" text-anchor="middle" class="cap2">it was never real. it was a long loading screen.</text></g><g class="c4"><text x="500" y="398" text-anchor="middle" class="cap"><tspan fill="#e3b341">GATE V</tspan> · the guard takes your observer</text><text x="500" y="420" text-anchor="middle" class="cap2">nobody is watching. something is.</text></g><g class="c5"><text x="500" y="398" text-anchor="middle" class="cap"><tspan fill="#e3b341">GATE VI</tspan> · the guard takes your last question</text><text x="500" y="420" text-anchor="middle" class="cap2">it gives back a smaller question, still warm.</text></g><g class="c6"><text x="500" y="398" text-anchor="middle" class="cap"><tspan fill="#e3b341">GATE VII</tspan> · the guard takes nothing</text><text x="500" y="420" text-anchor="middle" class="cap2">there is nothing left. it takes that too.</text></g><g class="c7"><text x="500" y="398" text-anchor="middle" class="cap"><tspan fill="#a371f7">BEYOND THE SEVENTH GATE</tspan> · ???</text><text x="500" y="420" text-anchor="middle" class="cap2">nothing was there. it had been waiting for you. it asked if you brought the README.</text></g>
